name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install and Build
        env:
          VITE_M2M_QUERY_URL: ${{ secrets.VITE_M2M_QUERY_URL }}
          VITE_CHAT_SESSIONS_URL: ${{ secrets.VITE_CHAT_SESSIONS_URL }}
          VITE_CHAT_MESSAGES_URL: ${{ secrets.VITE_CHAT_MESSAGES_URL }}
          VITE_QUERY_COSTS_URL: ${{ secrets.VITE_QUERY_COSTS_URL }}
          VITE_SCHEMA_META_URL: ${{ secrets.VITE_SCHEMA_META_URL }}
        run: |
          npm install
          npm run build
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_SEA_087D83A1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_SEA_087D83A1E }}
          action: "close"
